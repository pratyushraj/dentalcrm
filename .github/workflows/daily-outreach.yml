name: 📧 Daily Dental Outreach (Auto-Pilot)

on:
  schedule:
    # Runs at 00:30 UTC = 6:00 AM IST daily (30 mins after Resend quota resets at midnight UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI any time
    inputs:
      dry_run:
        description: 'Dry run (verify mailboxes but do not actually send)?'
        required: false
        default: 'false'
      limit:
        description: 'Max emails to send (default: 95)'
        required: false
        default: '95'

jobs:
  outreach:
    name: Send Daily Dentist Emails
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        run: |
          pip install dnspython

      - name: 🔍 Verify environment
        run: |
          python3 -c "import dns.resolver, smtplib, sqlite3; print('✅ All dependencies ready')"

      - name: 📊 Show lead database stats (before run)
        run: |
          python3 -c "
          import sys, json
          sys.path.insert(0, 'src/scripts/outreach')
          from leads_db import init_db, get_db_stats
          init_db()
          stats = get_db_stats()
          print('--- Clinaza Leads DB (Before Run) ---')
          print(f'Total Leads: {stats[\"total\"]}')
          print(f'Status Breakdown: {json.dumps(stats[\"breakdown\"], indent=2)}')
          "

      - name: 📧 Run daily email dispatch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cd src/scripts/outreach

          DRY_RUN_FLAG=""
          LIMIT_ARG="--limit=${{ github.event.inputs.limit || '95' }}"

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "🧪 Running in DRY-RUN mode (no emails will be sent)"
          else
            echo "🚀 Running LIVE dispatch — verified mailboxes only"
          fi

          python3 daily_dispatcher.py $LIMIT_ARG $DRY_RUN_FLAG

      - name: 📊 Show lead database stats (after run)
        run: |
          python3 -c "
          import sys, json
          sys.path.insert(0, 'src/scripts/outreach')
          from leads_db import get_db_stats
          stats = get_db_stats()
          print('--- Clinaza Leads DB (After Run) ---')
          print(f'Total Leads: {stats[\"total\"]}')
          print(f'Status Breakdown: {json.dumps(stats[\"breakdown\"], indent=2)}')
          pending = stats['breakdown'].get('pending', 0)
          print(f'Remaining Pending: {pending} leads')
          "

      - name: 💾 Commit updated lead state back to repo
        run: |
          git config user.name "Clinaza Outreach Bot"
          git config user.email "contact@clinaza.in"
          git add src/scripts/outreach/leads_data.json
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit — no new emails sent or all pending exhausted."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore(outreach): daily dispatch state update [${TIMESTAMP}]"
            git push origin main
            echo "✅ Lead state committed and pushed to main."
          fi
