name: Public HTML & SEO Integrity

on:
  push:
    branches: [ main ]
    paths: &seo-paths
      - 'src/**'
      - 'public/**'
      - 'scripts/prerender.mjs'
      - 'scripts/seo-*.mjs'
      - 'scripts/lib/seo-html.mjs'
      - 'index.html'
      - 'package*.json'
      - 'vercel.json'
      - '.github/workflows/seo-drift.yml'
  pull_request:
    branches: [ main ]
    paths: *seo-paths
  workflow_dispatch:

jobs:
  public-html:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reject shell and indexing regressions
        run: node --test scripts/seo-html.test.mjs
      - name: Build rendered production pages
        run: npm run build
        env:
          VERCEL: '1'
      - name: Validate public HTML without JavaScript
        run: npm run seo:drift
        env:
          SEO_DIST_DIR: dist
