name: SEO Drift & Integrity Monitor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  seo-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run SEO Drift Check
        run: |
          node scripts/seo-drift.mjs
        env:
          BASE_URL: 'https://www.clinaza.in'
