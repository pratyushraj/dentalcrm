name: SEO Drift & Integrity Monitor

on:
  push:
    branches: [ main ]
    paths:
      - 'src/components/seo/**'
      - 'src/data/blogs*'
      - 'src/pages/CityLandingPage.tsx'
      - 'src/pages/FreeToolsHub.tsx'
      - 'scripts/prerender.mjs'
      - 'scripts/seo-drift.mjs'
      - '.github/workflows/seo-drift.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/components/seo/**'
      - 'src/data/blogs*'
      - 'src/pages/CityLandingPage.tsx'
      - 'src/pages/FreeToolsHub.tsx'
      - 'scripts/prerender.mjs'
      - 'scripts/seo-drift.mjs'
      - '.github/workflows/seo-drift.yml'
  workflow_dispatch:

jobs:
  seo-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Vercel Deployment & Run SEO Drift Check
        run: |
          echo "Waiting 30s for Vercel deployment to propagate to edge..."
          sleep 30
          node scripts/seo-drift.mjs
        env:
          BASE_URL: 'https://www.clinaza.in'
